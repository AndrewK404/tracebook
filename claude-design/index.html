<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leibniz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          display: ['"Inter Tight"', 'Inter', 'ui-sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      }
    }
  }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #08080a;
    --bg-1: #0e0e11;
    --bg-2: #141418;
    --bg-3: #1c1c21;
    --line-0: #1f1f24;
    --line-1: #2a2a30;
    --line-2: #38383f;
    --ink-0: #f4f4f5;
    --ink-1: #d4d4d8;
    --ink-2: #a1a1aa;
    --ink-3: #71717a;
    --ink-4: #52525b;
    --emerald: #34d399;
    --emerald-soft: #6ee7b7;
    --amber: #fbbf24;
    --rose: #fb7185;
    --violet: #a78bfa;
    --cyan: #67e8f9;
    --sky: #7dd3fc;
  }
  html, body {
    background: var(--bg-0);
    color: var(--ink-1);
    font-family: 'Inter', ui-sans-serif, system-ui;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
    font-size: 14px;
    line-height: 1.5;
  }
  body {
    background-image:
      radial-gradient(circle at 0% 0%, rgba(52,211,153,0.025) 0%, transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(167,139,250,0.02) 0%, transparent 40%);
    background-attachment: fixed;
  }

  .num, .font-mono, .tabular { font-variant-numeric: tabular-nums; }
  .display { font-family: 'Inter Tight', Inter, ui-sans-serif; letter-spacing: -0.02em; }
  .display-tight { font-family: 'Inter Tight', Inter, ui-sans-serif; letter-spacing: -0.03em; }

  /* Type scale */
  .t-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1; letter-spacing: 0.04em; color: var(--ink-3); text-transform: lowercase; }
  .t-label   { font-size: 11.5px; line-height: 1.4; color: var(--ink-3); }
  .t-meta    { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-3); }
  .t-body    { font-size: 13px; line-height: 1.5; color: var(--ink-1); }
  .t-small   { font-size: 12px; color: var(--ink-2); }
  .t-h1      { font-family: 'Inter Tight', Inter; font-weight: 600; font-size: 26px; letter-spacing: -0.02em; color: var(--ink-0); line-height: 1.15; }
  .t-h2      { font-family: 'Inter Tight', Inter; font-weight: 600; font-size: 18px; letter-spacing: -0.015em; color: var(--ink-0); line-height: 1.2; }
  .t-kpi     { font-family: 'Inter Tight', Inter; font-weight: 600; font-size: 32px; letter-spacing: -0.025em; color: var(--ink-0); line-height: 1; font-variant-numeric: tabular-nums; }
  .t-kpi-sm  { font-family: 'Inter Tight', Inter; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; color: var(--ink-0); line-height: 1; font-variant-numeric: tabular-nums; }

  /* Surfaces */
  .surface-1 {
    background: linear-gradient(180deg, rgba(28,28,33,0.8) 0%, rgba(20,20,24,0.8) 100%);
    border: 1px solid var(--line-0);
    border-radius: 10px;
  }
  .surface-2 {
    background: var(--bg-2);
    border: 1px solid var(--line-0);
    border-radius: 8px;
  }
  .surface-inset {
    background: var(--bg-0);
    border: 1px solid var(--line-0);
    border-radius: 6px;
  }
  .surface-glass {
    background: rgba(14,14,17,0.75);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border-bottom: 1px solid var(--line-0);
  }

  /* Hairline */
  .hr-line { background: var(--line-0); }

  /* Pulses */
  @keyframes pulse-emerald { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.55); } 50% { box-shadow: 0 0 0 5px rgba(52,211,153,0); } }
  @keyframes pulse-amber   { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.55); } 50% { box-shadow: 0 0 0 5px rgba(251,191,36,0); } }
  .pulse-emerald { animation: pulse-emerald 1.8s cubic-bezier(.4,0,.2,1) infinite; }
  .pulse-amber   { animation: pulse-amber 1.8s cubic-bezier(.4,0,.2,1) infinite; }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .shimmer {
    background: linear-gradient(90deg, transparent 0%, rgba(52,211,153,0.15) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 2.4s linear infinite;
  }

  /* Selection */
  ::selection { background: rgba(52,211,153,0.22); color: #fff; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #25252b; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a42; }

  /* Focus ring */
  *:focus-visible { outline: 1px solid rgba(52,211,153,0.55); outline-offset: 2px; border-radius: 4px; }

  /* Diff */
  .diff-add { background: rgba(52,211,153,0.06); color: #6ee7b7; }
  .diff-del { background: rgba(251,113,133,0.06); color: #fda4af; }

  /* Rail */
  .rail-link {
    position: relative;
    display: flex; align-items: center; gap: 11px;
    padding: 7px 12px;
    border-radius: 7px;
    color: var(--ink-2);
    font-size: 13px;
    transition: color 120ms, background-color 120ms;
  }
  .rail-link:hover { color: var(--ink-0); background: rgba(40,40,46,0.4); }
  .rail-link.active { color: var(--ink-0); background: rgba(40,40,46,0.7); }
  .rail-link.active::before {
    content: ''; position: absolute; left: -1px; top: 9px; bottom: 9px;
    width: 2px; background: var(--emerald); border-radius: 0 2px 2px 0;
    box-shadow: 0 0 8px rgba(52,211,153,0.5);
  }
  .rail-link svg { color: var(--ink-3); flex-shrink: 0; }
  .rail-link.active svg, .rail-link:hover svg { color: var(--ink-1); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12.5px; font-weight: 500;
    border: 1px solid transparent;
    transition: all 120ms ease-out;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn-emerald { background: rgba(52,211,153,0.10); color: #6ee7b7; border-color: rgba(52,211,153,0.30); }
  .btn-emerald:hover { background: rgba(52,211,153,0.16); border-color: rgba(52,211,153,0.50); color: #a7f3d0; }
  .btn-neutral { background: var(--bg-2); color: var(--ink-1); border-color: var(--line-1); }
  .btn-neutral:hover { background: var(--bg-3); border-color: var(--line-2); color: var(--ink-0); }
  .btn-ghost { background: transparent; color: var(--ink-2); border-color: transparent; }
  .btn-ghost:hover { color: var(--ink-0); background: var(--bg-2); }
  .btn-ghost.active { background: var(--bg-3); color: var(--ink-0); border-color: var(--line-1); }

  /* Filter pill */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--line-0);
    background: var(--bg-2);
    color: var(--ink-2);
    cursor: pointer;
    transition: all 120ms;
  }
  .pill:hover { border-color: var(--line-2); color: var(--ink-0); }
  .pill.active { border-color: rgba(52,211,153,0.5); color: var(--emerald); background: rgba(52,211,153,0.06); }

  /* Chip */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--line-0);
    background: var(--bg-2);
    color: var(--ink-2);
    line-height: 1.5;
  }
  .chip-emerald { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.25); color: #6ee7b7; }
  .chip-amber { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.25); color: #fcd34d; }
  .chip-rose { background: rgba(251,113,133,0.08); border-color: rgba(251,113,133,0.25); color: #fda4af; }
  .chip-violet { background: rgba(167,139,250,0.08); border-color: rgba(167,139,250,0.25); color: #c4b5fd; }
  .chip-cyan { background: rgba(103,232,249,0.08); border-color: rgba(103,232,249,0.25); color: #a5f3fc; }
  .chip-sky { background: rgba(125,211,252,0.08); border-color: rgba(125,211,252,0.25); color: #bae6fd; }

  /* Kbd */
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 4px;
    background: var(--bg-2);
    border: 1px solid var(--line-1);
    border-bottom-width: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-2);
    line-height: 1;
  }

  /* Hover row */
  .hover-row { transition: background-color 120ms; }
  .hover-row:hover { background: rgba(28,28,33,0.5); }

  /* Eyebrow numbered marker */
  .eyebrow-num {
    display: inline-flex; align-items: baseline; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1;
  }
  .eyebrow-num .num-tag { color: var(--ink-4); }
  .eyebrow-num .label { color: var(--ink-2); }
  .eyebrow-num .dot { color: var(--ink-4); }
  .eyebrow-num .meta { color: var(--ink-4); }

  /* Stat delta */
  .delta-up { color: #6ee7b7; }
  .delta-down { color: #fda4af; }
  .delta-flat { color: var(--ink-3); }

  /* Sparkline area */
  .spark-fill { fill: rgba(52,211,153,0.08); }
  .spark-line { stroke: #34d399; stroke-width: 1.25; fill: none; }

  /* Trace lanes */
  .lane-assistant { background: linear-gradient(90deg, rgba(52,211,153,0.18), rgba(52,211,153,0.32)); border-left: 2px solid #34d399; }
  .lane-tool { background: linear-gradient(90deg, rgba(167,139,250,0.18), rgba(167,139,250,0.32)); border-left: 2px solid #a78bfa; }
  .lane-llm { background: linear-gradient(90deg, rgba(125,211,252,0.18), rgba(125,211,252,0.32)); border-left: 2px solid #7dd3fc; }
  .lane-skill { background: linear-gradient(90deg, rgba(251,191,36,0.18), rgba(251,191,36,0.32)); border-left: 2px solid #fbbf24; }
  .lane-mcp { background: linear-gradient(90deg, rgba(103,232,249,0.18), rgba(103,232,249,0.32)); border-left: 2px solid #67e8f9; }

  /* Trace tree row */
  .trace-row { transition: background-color 100ms; cursor: pointer; }
  .trace-row:hover { background: rgba(40,40,46,0.4); }
  .trace-row.selected { background: rgba(52,211,153,0.06); border-left-color: #34d399 !important; }

  /* Tabs */
  .tabline {
    position: relative;
    padding: 9px 1px;
    margin-right: 18px;
    font-size: 13px;
    color: var(--ink-3);
    border: none;
    background: transparent;
    cursor: pointer;
    transition: color 120ms;
  }
  .tabline:hover { color: var(--ink-1); }
  .tabline.active { color: var(--ink-0); }
  .tabline.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 1px; background: var(--emerald);
  }

  /* Donut animation */
  .donut-track { stroke: var(--bg-2); }

  /* Subtle gradient for KPI accent corner */
  .kpi-accent {
    position: relative;
    overflow: hidden;
  }
  .kpi-accent::after {
    content: ''; position: absolute; top: 0; right: 0; width: 60%; height: 60%;
    background: radial-gradient(circle at top right, rgba(52,211,153,0.05), transparent 70%);
    pointer-events: none;
  }

  /* Range bar */
  .range-bar { background: var(--bg-0); border: 1px solid var(--line-0); border-radius: 999px; height: 6px; overflow: hidden; }
  .range-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #34d399, #6ee7b7); }

  /* JSON view */
  .json-key { color: #a5f3fc; }
  .json-string { color: #6ee7b7; }
  .json-number { color: #fcd34d; }
  .json-bool { color: #fda4af; }
  .json-null { color: var(--ink-4); }
  .json-bracket { color: var(--ink-3); }

  /* dotted leader */
  .dotted-leader {
    background-image: radial-gradient(circle, var(--line-1) 1px, transparent 1px);
    background-size: 4px 4px;
    background-repeat: repeat-x;
    background-position: bottom;
  }

  /* tag for trace tree depth indent */
  .indent-1 { padding-left: 16px; }
  .indent-2 { padding-left: 32px; }
  .indent-3 { padding-left: 48px; }

  /* spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1.4s linear infinite; }

  /* fade in for screen transitions — no-op for now, base visible */
  .fade-up { opacity: 1; }

  /* sessions zebra rows */
  .sessions-zebra > li:nth-child(odd) { background: rgba(255,255,255,0.012); }

</style>
</head>
<body class="min-h-screen flex">

<div id="root" class="flex-1 flex"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  }/*EDITMODE-END*/;

</body>
