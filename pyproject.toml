[project]
name = "tracebook"
version = "0.1.0"
description = "Local dashboard for Claude Code (and Codex) session transcripts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Kuncevich" }]
keywords = ["claude-code", "codex", "agent", "observability", "dashboard"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "watchdog>=5.0",
]

[project.scripts]
tracebook = "tracebook.__main__:main"

[project.urls]
Homepage = "https://github.com/AndrewK404/tracebook"
Repository = "https://github.com/AndrewK404/tracebook"
Issues = "https://github.com/AndrewK404/tracebook/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracebook"]

[tool.hatch.build.targets.wheel.force-include]
"tracebook/templates" = "tracebook/templates"
"tracebook/static" = "tracebook/static"

[tool.ruff]
line-length = 100
target-version = "py311"
