[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracebook"
version = "0.1.0"
description = "Local dashboard for Claude Code sessions"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "watchdog>=4.0",
    "python-dateutil>=2.9",
]

[project.scripts]
tracebook = "tracebook.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tracebook"]
